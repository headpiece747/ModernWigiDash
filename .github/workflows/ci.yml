name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ModernWigiDash.slnx

      - name: Build
        run: dotnet build ModernWigiDash.slnx --configuration Release --no-restore

      - name: Test (full suite except the load-sensitive activation test)
        run: dotnet test ModernWigiDash.Tests/ModernWigiDash.Tests.csproj --configuration Release --no-build --no-restore --filter "FullyQualifiedName!~Primary_ActivationSignal_FiresTheCallbackAndReParks"

      - name: Test (load-sensitive activation test, bounded retry)
        shell: pwsh
        run: |
          # SingleInstanceGuardTests.Primary_ActivationSignal_FiresTheCallbackAndReParks
          # observes the no-lost-signal invariant through real
          # ThreadPool.RegisterWaitForSingleObject callbacks, so on a loaded
          # shared runner the thread pool can be starved past any fixed
          # ceiling. It runs in a fresh test host with a bounded retry: a
          # real regression fails every attempt, while a runner-load flake
          # lands on a less-loaded moment and passes. The other 2024 tests
          # run once, unmasked, in the step above.
          $filter = 'FullyQualifiedName~Primary_ActivationSignal_FiresTheCallbackAndReParks'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            dotnet test ModernWigiDash.Tests/ModernWigiDash.Tests.csproj --configuration Release --no-build --no-restore --filter $filter
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Activation test attempt ${attempt}/3 failed; retrying (shared-runner load can starve the thread pool)..."
          }
          exit 1

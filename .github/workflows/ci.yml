name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ModernWigiDash.slnx

      - name: Build
        run: dotnet build ModernWigiDash.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ModernWigiDash.Tests/ModernWigiDash.Tests.csproj --configuration Release --no-build --no-restore

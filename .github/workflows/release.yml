name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for this release (e.g. v0.1.0). The tag is created if it does not exist."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      # The v4 majors target Node 20, which GitHub deprecated: every run logged
      # "Node.js 20 is deprecated ... forced to run on Node.js 24". v7/v6 are the
      # current majors and run on Node 24 natively. That line was noise, never a
      # failure, but it sat at the end of the log next to the real error.
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build release zip
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "Provide a tag input for a manual release, or push a v* tag." }
          $version = $tag.TrimStart("v")
          ./scripts/build-release.ps1 -Version $version

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "Provide a tag input for a manual release, or push a v* tag." }
          $version = $tag.TrimStart("v")
          # Both artifacts are load-bearing: the full bundle is the fresh
          # install, the app-only zip is the in-app updater's payload.
          $fullZip = "ModernWigiDash-v$version-win-x64.zip"
          $slimZip = "ModernWigiDash-v$version-app-only.zip"
          # Idempotent publish: a release may already exist (created by hand,
          # or by an earlier trigger of this same tag). gh release create fails
          # on an existing tag, which turned a re-trigger into a false-failure
          # (the v0.6.9 run). When the release exists, upload the freshly built
          # zips with --clobber (same-named assets are replaced in place, never
          # duplicated); only create the release when it is absent. Do NOT
          # delete the release first: gh release upload cannot target a deleted
          # release, so the old delete-then-upload path deleted the release and
          # then failed with "release not found" (the v0.8.0 run), leaving the
          # tag with no release at all.
          $existing = $null
          try { $existing = gh release view $tag --json tagName -q .tagName 2>$null } catch { $existing = $null }
          if ($existing) {
            Write-Host "Release $tag already exists; replacing its assets in place."
            gh release upload $tag $fullZip $slimZip --clobber
          } else {
            Write-Host "Creating release $tag."
            gh release create $tag $fullZip $slimZip --generate-notes
          }

      - name: Verify published assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Read the release back and compare each asset's size to the file this
          # run built. The publish step is not trusted to have landed the right
          # bytes: the v0.7.0 release carried a 105.9 MB full-bundle asset that
          # was really the slim payload, and nothing failed. Nothing here deletes
          # anything, so a mismatch fails the run while the release keeps
          # whatever it already held.
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          $version = $tag.TrimStart("v")
          $expected = [ordered]@{
            "ModernWigiDash-v$version-win-x64.zip"  = (Get-Item "ModernWigiDash-v$version-win-x64.zip").Length
            "ModernWigiDash-v$version-app-only.zip" = (Get-Item "ModernWigiDash-v$version-app-only.zip").Length
          }
          $release = gh release view $tag --json assets | ConvertFrom-Json
          foreach ($name in $expected.Keys) {
            $asset = $release.assets | Where-Object { $_.name -eq $name }
            if (-not $asset) { throw "Release $tag has no asset named $name after publish." }
            if ($asset.size -ne $expected[$name]) { throw "Asset $name on $tag is $($asset.size) bytes; this run built $($expected[$name]) bytes." }
            Write-Host ("verified {0}: {1:N0} bytes" -f $name, $asset.size)
          }

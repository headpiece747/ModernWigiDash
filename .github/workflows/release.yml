name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for this release (e.g. v0.1.0). The tag is created if it does not exist."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build release zip
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "Provide a tag input for a manual release, or push a v* tag." }
          $version = $tag.TrimStart("v")
          ./scripts/build-release.ps1 -Version $version

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag }}" }
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "Provide a tag input for a manual release, or push a v* tag." }
          $version = $tag.TrimStart("v")
          # Both artifacts are load-bearing: the full bundle is the fresh
          # install, the app-only zip is the in-app updater's payload.
          $fullZip = "ModernWigiDash-v$version-win-x64.zip"
          $slimZip = "ModernWigiDash-v$version-app-only.zip"
          # Idempotent publish: a release may already exist (created by hand,
          # or by an earlier trigger of this same tag). gh release create fails
          # on an existing tag, which turned a re-trigger into a false-failure
          # (the v0.6.9 run). When the release exists, upload the freshly built
          # zips with --clobber (same-named assets are replaced in place, never
          # duplicated); only create the release when it is absent. Do NOT
          # delete the release first: gh release upload cannot target a deleted
          # release, so the old delete-then-upload path deleted the release and
          # then failed with "release not found" (the v0.8.0 run), leaving the
          # tag with no release at all.
          $existing = $null
          try { $existing = gh release view $tag --json tagName -q .tagName 2>$null } catch { $existing = $null }
          if ($existing) {
            Write-Host "Release $tag already exists; replacing its assets in place."
            gh release upload $tag $fullZip $slimZip --clobber
          } else {
            Write-Host "Creating release $tag."
            gh release create $tag $fullZip $slimZip --generate-notes
          }
